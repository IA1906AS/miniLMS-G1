[project]
name = "lms-project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CuongRevival", email = "trainingsession495@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
lms-project-1 = "lms_project_1:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
mypy_path = ["src"]
packages = ["lms_project_1"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=lms_project_1",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]

[tool.coverage.run]
branch = true
source = ["lms_project_1"]

[tool.coverage.report]
show_missing = true
skip_covered = true
